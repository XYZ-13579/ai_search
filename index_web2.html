<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>AI Assistant</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        :root {
            --bg: #030507;
            --fg: #e6eef2;
            --dim: rgba(230, 238, 242, .42);
            --line: rgba(230, 238, 242, .1);
            --acc: #8ee9ff
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
            font-weight: 300;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
            padding: 0
        }

        svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block
        }

        .ico {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--dim);
            transition: color .2s, background .2s
        }

        .ico:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, .06)
        }

        /* header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            position: relative;
            z-index: 2
        }

        #state {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            letter-spacing: .12em;
            color: var(--dim)
        }

        #core {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid var(--dim);
            position: relative;
            transition: border-color .3s
        }

        #core::after {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: var(--dim);
            transition: background .3s
        }

        #core.listen {
            border-color: var(--acc)
        }

        #core.listen::after {
            background: var(--acc);
            animation: breathe 1.6s ease-in-out infinite
        }

        #core.think {
            border-color: transparent;
            border-top-color: var(--acc);
            animation: spin .9s linear infinite
        }

        #core.speak {
            border-color: var(--acc)
        }

        #core.speak::after {
            background: var(--acc);
            animation: breathe .8s ease-in-out infinite
        }

        @keyframes breathe {
            50% {
                transform: scale(.45);
                opacity: .5
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #lang {
            font-size: 12px;
            letter-spacing: .1em;
            color: var(--dim);
            padding: 8px 12px;
            border-radius: 16px
        }

        #lang:hover {
            color: var(--fg)
        }

        /* log */
        #logWrap {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent
        }

        #log {
            max-width: 720px;
            margin: 0 auto;
            padding: 12px 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 30px
        }

        .msg {
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            animation: in .3s ease
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(6px)
            }
        }

        .msg.u {
            align-self: flex-end;
            max-width: 80%;
            color: var(--dim);
            font-size: calc(var(--fs) - 2px);
            text-align: right
        }

        .msg.a {
            font-size: var(--fs);
            color: var(--fg)
        }

        .src {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px
        }

        .src a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--dim);
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px 12px 6px 8px;
            max-width: 100%;
            transition: color .2s, border-color .2s
        }

        .src a img {
            flex: none;
            width: 16px;
            height: 16px;
            border-radius: 4px
        }

        .src a .b {
            min-width: 0;
            display: flex;
            flex-direction: column;
            line-height: 1.35
        }

        .src a .b span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .src a .d {
            font-size: 11px;
            opacity: .65
        }

        .acts {
            display: flex;
            gap: 2px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity .2s
        }

        .msg:hover .acts,
        .msg:focus-within .acts {
            opacity: 1
        }

        .msg.u .acts {
            justify-content: flex-end
        }

        @media(hover:none) {
            .acts {
                opacity: .6
            }
        }

        .acts button {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--dim);
            transition: color .2s, background .2s
        }

        .acts button:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, .06)
        }

        .acts svg {
            width: 16px;
            height: 16px
        }

        body.busy .acts {
            display: none
        }

        .msg.u.editing {
            width: 80%;
            max-width: 80%
        }

        .edit {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(142, 233, 255, .45);
            border-radius: 14px;
            color: var(--fg);
            font: inherit;
            font-size: inherit;
            padding: 10px 14px;
            outline: 0;
            resize: none;
            text-align: left;
            line-height: 1.7
        }

        .editbar {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 8px;
            font-size: 13px
        }

        .editbar button {
            color: var(--dim)
        }

        .editbar button:hover {
            color: var(--fg)
        }

        .editbar .go {
            color: var(--acc)
        }

        .src a:hover {
            color: var(--acc);
            border-color: var(--acc)
        }

        #empty {
            margin: auto;
            color: var(--dim);
            font-size: 14px;
            letter-spacing: .2em
        }

        /* composer */
        #composer {
            position: relative;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 0 24px 26px
        }

        #interim {
            min-height: 22px;
            font-size: 14px;
            color: var(--acc);
            opacity: .85;
            padding: 0 6px 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        #bar {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 4px 6px;
            transition: border-color .25s;
            background: rgba(255, 255, 255, .015)
        }

        #bar:focus-within {
            border-color: rgba(142, 233, 255, .45)
        }

        #textInput {
            flex: 1;
            min-width: 0;
            background: none;
            border: 0;
            outline: 0;
            color: var(--fg);
            font: inherit;
            font-size: 16px;
            padding: 10px 6px
        }

        #textInput::placeholder {
            color: var(--dim)
        }

        #micBtn.on {
            color: var(--acc)
        }

        #webBtn {
            position: relative
        }

        #webBtn.on {
            color: var(--acc)
        }

        #webBtn.on::after {
            content: "";
            position: absolute;
            bottom: 5px;
            left: 50%;
            width: 4px;
            height: 4px;
            margin-left: -2px;
            border-radius: 50%;
            background: var(--acc)
        }

        #micBtn.on {
            box-shadow: 0 0 0 1px var(--acc);
            animation: ring 1.8s ease-out infinite
        }

        @keyframes ring {
            70% {
                box-shadow: 0 0 0 9px rgba(142, 233, 255, 0)
            }

            100% {
                box-shadow: 0 0 0 9px rgba(142, 233, 255, 0)
            }
        }

        #sendBtn {
            color: var(--fg)
        }

        #vis {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 78px;
            height: 56px;
            width: calc(100% - 48px);
            pointer-events: none;
            opacity: 0
        }

        /* drawer */
        #scrim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
            z-index: 20
        }

        #drawer {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 300px;
            max-width: 86vw;
            background: #06090c;
            border-right: 1px solid var(--line);
            transform: translateX(-100%);
            transition: transform .32s ease;
            z-index: 21;
            display: flex;
            flex-direction: column
        }

        body.open #drawer {
            transform: none
        }

        body.open #scrim {
            opacity: 1;
            pointer-events: auto
        }

        .d-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px
        }

        #newBtn {
            font-size: 14px;
            color: var(--acc);
            padding: 8px 4px
        }

        #list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent
        }

        .item {
            display: flex;
            align-items: center;
            gap: 4px;
            border-radius: 12px;
            padding: 2px 2px 2px 12px;
            cursor: pointer;
            color: var(--dim);
            transition: background .2s, color .2s
        }

        .item:hover {
            background: rgba(255, 255, 255, .04);
            color: var(--fg)
        }

        .item.cur {
            color: var(--fg);
            background: rgba(255, 255, 255, .06)
        }

        .item .t {
            flex: 1;
            min-width: 0;
            padding: 10px 0;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .item .del {
            width: 32px;
            height: 32px;
            opacity: 0
        }

        .item:hover .del,
        .item.cur .del {
            opacity: 1
        }

        .none {
            padding: 18px 12px;
            font-size: 13px;
            color: var(--dim)
        }

        .d-foot {
            padding: 10px 18px 18px;
            border-top: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--dim);
            padding: 9px 0
        }

        .row b {
            font-weight: 300;
            color: var(--fg)
        }

        .row input {
            width: 120px;
            accent-color: var(--acc)
        }

        .danger:hover {
            color: #ff8c8c
        }

        @media(max-width:600px) {

            #log,
            #composer {
                padding-left: 16px;
                padding-right: 16px
            }

            #vis {
                left: 16px;
                width: calc(100% - 32px)
            }
        }

        /* start */
        #start {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: var(--bg);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: opacity .5s
        }

        #start span {
            font-size: 15px;
            letter-spacing: .3em;
            color: var(--dim);
            animation: breathe2 2.4s ease-in-out infinite
        }

        @keyframes breathe2 {
            50% {
                opacity: .35
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body style="--fs:20px">

    <header>
        <button class="ico" id="menuBtn" title="履歴"><svg viewBox="0 0 24 24">
                <path d="M4 8h16M4 16h10" />
            </svg></button>
        <div id="state">
            <div id="core"></div><span id="statusText">待機中</span>
        </div>
        <button id="lang">JA</button>
    </header>

    <div id="logWrap">
        <div id="log"></div>
    </div>

    <div id="composer">
        <canvas id="vis"></canvas>
        <div id="interim"></div>
        <div id="bar">
            <button class="ico" id="micBtn" title="音声入力"><svg viewBox="0 0 24 24">
                    <rect x="9" y="3" width="6" height="11" rx="3" />
                    <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
                </svg></button>
            <button class="ico" id="webBtn"></button>
            <input id="textInput" autocomplete="off" placeholder="メッセージ">
            <button class="ico" id="sendBtn" title="送信"></button>
        </div>
    </div>

    <div id="scrim"></div>
    <aside id="drawer">
        <div class="d-top"><button id="newBtn">＋ 新しい会話</button><button class="ico" id="closeBtn"><svg
                    viewBox="0 0 24 24">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg></button></div>
        <div id="list"></div>
        <div class="d-foot">
            <button class="row" id="ttsRow"><span>読み上げ</span><b id="ttsVal">ON</b></button>
            <div class="row"><span>文字の大きさ</span><input type="range" id="fsRange" min="14" max="32" value="20"></div>
            <button class="row danger" id="clearAll"><span>履歴をすべて削除</span></button>
        </div>
    </aside>

    <div id="start"><span id="startLabel">TAP TO START</span></div>

    <script>
        const $ = id => document.getElementById(id);
        const ICON = {
            send: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
            stop: '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
            del: '<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
            edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
            retry: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>',
            globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
        };

        // ── 設定 ─────────────────────────────────────────────
        const i18n = {
            ja: {
                idle: '待機中', listen: '聞いています', think: '考えています', speak: '話しています', search: '検索しています',
                sys: 'You are a kind and concise AI assistant. Please answer naturally in Japanese.',
                rec: 'ja-JP', ph: 'メッセージ', empty: '話しかけてください', newChat: '新しい会話', none: '履歴はまだありません',
                err: 'エラーが発生しました。もう一度お試しください。', mic: 'マイクが許可されていません', nosr: '音声認識に未対応です(Chromeを使用してください)',
                off: '検索サーバーに接続できないため、検索なしで回答します', web: { on: 'Web検索: ON', off: 'Web検索: OFF' }, retry: 'もう一度', edit: '編集', cancel: 'キャンセル', resend: '送信', confirmAll: '履歴をすべて削除しますか?', confirmOne: 'この会話を削除しますか?'
            },
            en: {
                idle: 'Ready', listen: 'Listening', think: 'Thinking', speak: 'Speaking', search: 'Searching',
                sys: 'You are a helpful, concise AI assistant. Please respond in English naturally as if in a conversation.',
                rec: 'en-US', ph: 'Message', empty: 'Say something', newChat: 'New chat', none: 'No history yet',
                err: 'An error occurred. Please try again.', mic: 'Microphone access was denied', nosr: 'Speech recognition is not supported (use Chrome)',
                off: 'Search server offline - answering without web search', web: { on: 'Web search: ON', off: 'Web search: OFF' }, retry: 'Retry', edit: 'Edit', cancel: 'Cancel', resend: 'Send', confirmAll: 'Delete all history?', confirmOne: 'Delete this chat?'
            },
        };
        const PREF_KEY = 'ai_prefs_v1', CHAT_KEY = 'ai_chats_v1';
        const prefs = Object.assign({ lang: 'ja', web: true, tts: true, fs: 20 }, readJSON(PREF_KEY, {}));
        if (typeof prefs.web === 'string') prefs.web = prefs.web !== 'off';   // 旧設定(auto/on/off)からの移行
        const t = k => i18n[prefs.lang][k];
        const serverUrl = 'http://127.0.0.1:8000/v1/chat/completions';
        const searchAskUrl = 'http://127.0.0.1:8002/ask';

        function readJSON(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }
        function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { } }
        const savePrefs = () => writeJSON(PREF_KEY, prefs);

        // ── 会話履歴(localStorageに保存) ─────────────────────
        let chats = readJSON(CHAT_KEY, []);
        let cur = null;                       // 現在の会話(最初の発言まで未保存)
        const saveChats = () => writeJSON(CHAT_KEY, chats);

        function newChat() {
            stopAll();
            cur = { id: Date.now().toString(36), title: '', updated: Date.now(), messages: [] };
            renderLog(); renderList();
        }
        function openChat(id) {
            const c = chats.find(x => x.id === id);
            if (!c) return;
            stopAll(); cur = c; renderLog(); renderList(); toggleDrawer(false);
        }
        function deleteChat(id) {
            if (!confirm(t('confirmOne'))) return;
            chats = chats.filter(c => c.id !== id); saveChats();
            if (cur && cur.id === id) newChat(); else renderList();
        }
        function clearAllChats() {
            if (!confirm(t('confirmAll'))) return;
            chats = []; saveChats(); newChat();
        }

        // ── 描画 ─────────────────────────────────────────────
        const log = $('log'), logWrap = $('logWrap');
        function scrollDown() { logWrap.scrollTop = logWrap.scrollHeight; }

        function fmtDate(iso) {
            const d = new Date(iso); if (isNaN(d)) return '';
            const p = n => String(n).padStart(2, '0');
            // 日付のみ(UTC 0:00)の場合は時刻を出さない
            if (!d.getUTCHours() && !d.getUTCMinutes() && !d.getUTCSeconds())
                return `${d.getUTCFullYear()}/${p(d.getUTCMonth() + 1)}/${p(d.getUTCDate())}`;
            return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        // 公開日時の表示用。日付のみ(UTC 0:00)の場合は時刻を出さない
        function fmtDate(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return '';
            const p = n => String(n).padStart(2, '0');
            if (!d.getUTCHours() && !d.getUTCMinutes() && !d.getUTCSeconds())
                return `${d.getUTCFullYear()}/${p(d.getUTCMonth() + 1)}/${p(d.getUTCDate())}`;
            return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function renderSources(box, sources) {
            box.textContent = '';
            (sources || []).forEach(s => {
                const raw = typeof s === 'string' ? s : s && s.url;
                const title = typeof s === 'string' ? '' : (s && (s.title || s.name)) || '';
                let u; try { u = new URL(raw); } catch (_) { return; }
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
                const a = document.createElement('a');
                a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = u.href;
                // サイトロゴ: Googleのfavicon → サイト直下のfavicon.ico → 非表示
                const img = document.createElement('img');
                img.alt = ''; img.referrerPolicy = 'no-referrer';
                let step = 0;
                img.onerror = () => {
                    if (step === 0) { step = 1; img.src = u.origin + '/favicon.ico'; }
                    else img.style.display = 'none';
                };
                img.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(u.hostname) + '&sz=64';
                const b = document.createElement('div'); b.className = 'b';
                const span = document.createElement('span');
                span.textContent = title || u.hostname.replace(/^www\./, '');
                b.appendChild(span);
                const ds = s && s.published ? fmtDate(s.published) : '';
                if (ds) { const d = document.createElement('span'); d.className = 'd'; d.textContent = ds; b.appendChild(d); }
                a.append(img, b);
                box.appendChild(a);
            });
        }
        function msgEl(m, i) {
            const d = document.createElement('div');
            d.className = 'msg ' + (m.role === 'user' ? 'u' : 'a');
            const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = m.content; d.appendChild(txt);
            if (m.role !== 'user') {
                const s = document.createElement('div'); s.className = 'src'; d.appendChild(s);
                if (m.sources && m.sources.length) renderSources(s, m.sources);
            }
            const acts = document.createElement('div'); acts.className = 'acts';
            if (m.role === 'user') acts.appendChild(actBtn(ICON.edit, t('edit'), () => startEdit(i, d)));
            else if (i === cur.messages.length - 1) acts.appendChild(actBtn(ICON.retry, t('retry'), retryLast));
            if (acts.children.length) d.appendChild(acts);
            return d;
        }
        function renderLog() {
            log.textContent = '';
            if (!cur || !cur.messages.length) {
                const e = document.createElement('div'); e.id = 'empty'; e.textContent = t('empty'); log.appendChild(e);
                return;
            }
            cur.messages.forEach((m, i) => log.appendChild(msgEl(m, i)));
            scrollDown();
        }
        function renderList() {
            const box = $('list'); box.textContent = '';
            if (!chats.length) { const n = document.createElement('div'); n.className = 'none'; n.textContent = t('none'); box.appendChild(n); return; }
            [...chats].sort((a, b) => b.updated - a.updated).forEach(c => {
                const it = document.createElement('div'); it.className = 'item' + (cur && cur.id === c.id ? ' cur' : '');
                const tt = document.createElement('div'); tt.className = 't'; tt.textContent = c.title || '…';
                const del = document.createElement('button'); del.className = 'ico del'; del.innerHTML = ICON.del; del.title = 'Delete';
                del.onclick = e => { e.stopPropagation(); deleteChat(c.id); };
                it.onclick = () => openChat(c.id);
                it.append(tt, del); box.appendChild(it);
            });
        }
        function actBtn(icon, title, fn) {
            const b = document.createElement('button'); b.innerHTML = icon; b.title = title;
            b.onclick = e => { e.stopPropagation(); fn(); };
            return b;
        }
        // i番目以降の履歴を捨てて、text で送り直す
        function resend(i, text) {
            if (busy()) stopAll();
            cur.messages.splice(i);
            send(text);
        }
        function retryLast() {
            if (!cur) return;
            for (let i = cur.messages.length - 1; i >= 0; i--)
                if (cur.messages[i].role === 'user') { resend(i, cur.messages[i].content); return; }
        }
        function startEdit(i, el) {
            if (busy()) return;
            const txt = el.querySelector('.txt'), acts = el.querySelector('.acts');
            const ta = document.createElement('textarea'); ta.className = 'edit'; ta.value = cur.messages[i].content;
            const submit = () => { const v = ta.value.trim(); if (v) resend(i, v); };
            ta.onkeydown = e => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
                else if (e.key === 'Escape') renderLog();
            };
            const bar = document.createElement('div'); bar.className = 'editbar';
            const cancel = document.createElement('button'); cancel.textContent = t('cancel'); cancel.onclick = () => renderLog();
            const go = document.createElement('button'); go.className = 'go'; go.textContent = t('resend'); go.onclick = submit;
            bar.append(cancel, go);
            el.classList.add('editing'); txt.replaceWith(ta); if (acts) acts.remove(); el.appendChild(bar);
            ta.style.height = 'auto'; ta.style.height = Math.min(200, ta.scrollHeight) + 'px';
            ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
        }
        function toggleDrawer(open) { document.body.classList.toggle('open', open ?? !document.body.classList.contains('open')); }

        function syncUI() {
            $('sendBtn').innerHTML = busy() ? ICON.stop : ICON.send;
            document.body.classList.toggle('busy', busy());
        }
        function setState(kind, label) {
            $('core').className = kind || '';
            $('statusText').textContent = label || t('idle');
        }
        function idleState() { setState(isMicRequested ? 'listen' : '', isMicRequested ? t('listen') : t('idle')); }

        function applyPrefs() {
            document.body.style.setProperty('--fs', prefs.fs + 'px');
            $('lang').textContent = prefs.lang.toUpperCase();
            $('textInput').placeholder = t('ph');
            $('ttsVal').textContent = prefs.tts ? 'ON' : 'OFF';
            $('webBtn').innerHTML = ICON.globe; $('webBtn').classList.toggle('on', prefs.web); $('webBtn').title = t('web')[prefs.web ? 'on' : 'off'];
            $('fsRange').value = prefs.fs;
            $('newBtn').textContent = '＋ ' + t('newChat');
            syncUI();
            if (!isGenerating && !isSpeaking) idleState();
            if (cur && !cur.messages.length) renderLog();
            renderList();
        }

        // ── 状態 ─────────────────────────────────────────────
        let isActive = false, isGenerating = false, isSpeaking = false, streamFinished = true;
        let activeUtterances = 0, isMicRequested = false, abortCtl = null, resumeTimer = null;
        const busy = () => isGenerating || isSpeaking;

        // ── TTS ──────────────────────────────────────────────
        let voices = [];
        const loadVoices = () => { voices = speechSynthesis.getVoices(); };
        loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
        const pickVoice = l => voices.find(v => v.lang === l) || voices.find(v => v.lang.startsWith(l.split('-')[0])) || null;

        function speakSentence(text) {
            if (!text.trim() || !prefs.tts) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = t('rec'); const v = pickVoice(u.lang); if (v) u.voice = v;
            activeUtterances++; isSpeaking = true;
            const done = () => {
                activeUtterances = Math.max(0, activeUtterances - 1);
                if (activeUtterances === 0 && streamFinished) finish();
            };
            u.onend = done; u.onerror = done;
            speechSynthesis.speak(u);
        }

        // 生成・読み上げが完全に終わったら音声認識を再開する
        function finish() {
            isGenerating = false; isSpeaking = false;
            syncUI();
            idleState();
            syncRecognition();
        }
        // 停止ボタン / 会話切り替え時の中断
        function stopAll() {
            if (abortCtl) { try { abortCtl.abort(); } catch (_) { } abortCtl = null; }
            streamFinished = true; activeUtterances = 0;
            speechSynthesis.cancel();
            if (busy()) finish();
        }

        // ── 音声認識 ─────────────────────────────────────────
        // AIが生成・読み上げ中は認識を止め、終わったら少し待って再開する。
        const SRCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null, recRunning = false, recTimer = null;

        function createRecognition() {
            const r = new SRCtor();
            r.continuous = true; r.interimResults = true; r.lang = t('rec');
            r.onstart = () => { recRunning = true; };
            r.onresult = e => {
                if (busy()) return;
                let interim = '', fin = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const x = e.results[i];
                    (x.isFinal ? (fin += x[0].transcript) : (interim += x[0].transcript));
                }
                $('interim').textContent = interim;
                fin = fin.trim();
                if (fin) { $('interim').textContent = ''; send(fin); }
            };
            r.onerror = e => {
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    isMicRequested = false; $('micBtn').classList.remove('on'); setState('', t('mic'));
                } else if (e.error !== 'no-speech' && e.error !== 'aborted') console.warn('[SpeechRecognition]', e.error);
            };
            r.onend = () => {
                recRunning = false;
                if (isMicRequested && isActive && !busy()) { clearTimeout(recTimer); recTimer = setTimeout(startRecognition, 300); }
            };
            return r;
        }
        function startRecognition() {
            if (!SRCtor) { setState('', t('nosr')); isMicRequested = false; $('micBtn').classList.remove('on'); return; }
            if (recRunning || busy()) return;
            recognition = createRecognition();
            try { recognition.start(); } catch (e) { console.warn(e); }
        }
        function stopRecognition() {
            clearTimeout(recTimer); clearTimeout(resumeTimer);
            if (recognition) { recognition.onend = null; try { recognition.abort(); } catch (_) { } recognition = null; }
            recRunning = false; $('interim').textContent = '';
        }
        function syncRecognition() {
            clearTimeout(resumeTimer);
            if (busy()) { stopRecognition(); return; }
            if (isMicRequested && isActive) resumeTimer = setTimeout(() => { if (!busy() && isMicRequested) startRecognition(); }, 600);
        }
        $('micBtn').onclick = () => {
            isMicRequested = !isMicRequested;
            $('micBtn').classList.toggle('on', isMicRequested);
            if (isMicRequested) { startRecognition(); } else { stopRecognition(); }
            if (!busy()) idleState();
        };

        // ── AI呼び出し ───────────────────────────────────────
        async function openStream(body, signal) {
            const headers = { 'Content-Type': 'application/json' };
            if (prefs.web) {
                try {
                    const res = await fetch(searchAskUrl, {
                        method: 'POST', headers, signal,
                        body: JSON.stringify({ ...body, mode: 'always', lang: prefs.lang })
                    });
                    if (res.ok) return res;
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                    setState('think', t('off'));
                }
            }
            return fetch(serverUrl, { method: 'POST', headers, signal, body: JSON.stringify({ ...body, stream: true }) });
        }

        async function send(text) {
            text = text.trim(); if (!text) return;
            if (busy()) stopAll();
            if (!cur) newChat();
            const first = !cur.messages.length;
            cur.messages.push({ role: 'user', content: text });
            if (first) { cur.title = text.slice(0, 28); if (!chats.includes(cur)) chats.push(cur); }
            const reply = { role: 'assistant', content: '', sources: [] };
            const history = cur.messages.slice(-20).map(m => ({ role: m.role, content: m.content }));
            cur.messages.push(reply); cur.updated = Date.now(); saveChats();
            renderLog(); renderList();
            const el = log.lastElementChild, txt = el.querySelector('.txt'), srcBox = el.querySelector('.src');

            isGenerating = true; streamFinished = false; activeUtterances = 0; isSpeaking = false;
            speechSynthesis.cancel();
            stopRecognition();                        // 生成中は認識を止める
            syncUI();
            setState('think', t('think'));

            const ctl = new AbortController(); abortCtl = ctl;
            try {
                const res = await openStream({
                    messages: [{ role: 'system', content: t('sys') }, ...history],
                    temperature: 0.7, max_tokens: 500,
                }, ctl.signal);
                if (!res.ok) throw new Error('API Error');

                const reader = res.body.getReader(), dec = new TextDecoder();
                let buf = '', speakBuf = '', started = false, sources = [];
                const ends = /[!?。！？\n]|\.(?=\s)/;
                const speakClean = s => { const x = s.replace(/https?:\/\/\S+/g, ''); if (x.trim()) speakSentence(x); };

                const line = l => {
                    if (!l.startsWith('data: ') || l === 'data: [DONE]') return;
                    let o; try { o = JSON.parse(l.slice(6)); } catch (_) { return; }
                    if (o.error) throw new Error(o.error);
                    if (o.web_search) {
                        const s = o.web_search.status;
                        if (s === 'searching') setState('think', t('search'));
                        else if (s === 'sources') sources = o.web_search.sources || [];
                        else setState('think', t('think'));
                        return;
                    }
                    const tok = o.choices?.[0]?.delta?.content;
                    if (!tok) return;
                    if (!started) { started = true; setState('speak', t('speak')); }
                    reply.content += tok; speakBuf += tok; txt.textContent = reply.content; scrollDown();
                    let m;
                    while ((m = speakBuf.match(ends)) !== null) {
                        const i = m.index + m[0].length;
                        speakClean(speakBuf.slice(0, i)); speakBuf = speakBuf.slice(i);
                    }
                };

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    const ls = buf.split('\n'); buf = ls.pop(); ls.forEach(line);
                }
                if (buf) line(buf);
                if (speakBuf.trim()) speakClean(speakBuf);

                reply.sources = sources.slice(0, 6); renderSources(srcBox, reply.sources);
                cur.updated = Date.now(); saveChats();
                streamFinished = true; abortCtl = null;
                if (activeUtterances === 0) finish();
            } catch (e) {
                if (e.name === 'AbortError') { cur.updated = Date.now(); saveChats(); return; }
                console.error(e);
                speechSynthesis.cancel(); activeUtterances = 0; streamFinished = true; abortCtl = null;
                reply.content = reply.content || t('err'); txt.textContent = reply.content; saveChats();
                finish();
            }
        }

        // ── 入力 ─────────────────────────────────────────────
        function submitText() {
            if (busy()) { stopAll(); return; }
            const v = $('textInput').value.trim();
            if (v) { $('textInput').value = ''; send(v); }
        }
        $('sendBtn').onclick = submitText;
        $('textInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitText(); } });

        // ── ドロワー・設定 ───────────────────────────────────
        $('menuBtn').onclick = () => toggleDrawer(true);
        $('closeBtn').onclick = $('scrim').onclick = () => toggleDrawer(false);
        $('newBtn').onclick = () => { newChat(); toggleDrawer(false); };
        $('clearAll').onclick = clearAllChats;
        $('ttsRow').onclick = () => {
            prefs.tts = !prefs.tts; savePrefs(); applyPrefs();
            if (!prefs.tts && isSpeaking) { speechSynthesis.cancel(); activeUtterances = 0; if (streamFinished) finish(); }
        };
        $('webBtn').onclick = () => { prefs.web = !prefs.web; savePrefs(); applyPrefs(); };   // 即時ON/OFF
        $('fsRange').oninput = e => { prefs.fs = +e.target.value; savePrefs(); applyPrefs(); };
        $('lang').onclick = () => {
            prefs.lang = prefs.lang === 'ja' ? 'en' : 'ja'; savePrefs(); applyPrefs();
            if (isMicRequested && !busy()) { stopRecognition(); startRecognition(); }   // 認識言語を反映
        };

        // ── 音声入力ビジュアライザー(話している間だけ表示) ──
        const vc = $('vis'), vx = vc.getContext('2d');
        let analyser = null, freqs = null, vAlpha = 0, holdUntil = 0;
        const BARS = 32, bars = new Float32Array(BARS);
        function sizeVis() { const r = vc.getBoundingClientRect(), d = devicePixelRatio || 1; vc.width = Math.max(1, r.width * d); vc.height = Math.max(1, r.height * d); }
        addEventListener('resize', sizeVis); sizeVis();

        function frame() {
            requestAnimationFrame(frame);
            const now = performance.now();
            const listening = isMicRequested && !busy() && analyser;
            let active = false;
            if (listening) {
                analyser.getByteFrequencyData(freqs);
                let s = 0; for (let i = 1; i < 28; i++) s += freqs[i];
                if (s / 27 / 255 > 0.12) holdUntil = now + 450;
                active = now < holdUntil;
            }
            for (let i = 0; i < BARS; i++) {
                const v = active ? freqs[1 + Math.floor(i * 27 / BARS)] / 255 : 0;
                bars[i] += (v - bars[i]) * (active ? 0.45 : 0.15);
            }
            vAlpha += ((active ? 1 : 0) - vAlpha) * 0.2;
            if (vAlpha < 0.02) { if (vc.style.opacity !== '0') { vc.style.opacity = '0'; vx.clearRect(0, 0, vc.width, vc.height); } return; }
            vc.style.opacity = vAlpha.toFixed(2);
            const W = vc.width, H = vc.height, g = W / BARS, bw = Math.max(2, g * 0.35);
            vx.clearRect(0, 0, W, H); vx.fillStyle = '#8ee9ff';
            for (let k = 0; k < BARS; k++) {
                const h = Math.max(2, bars[k] * H * 0.9);
                vx.fillRect(k * g + (g - bw) / 2, (H - h) / 2, bw, h);
            }
        }
        requestAnimationFrame(frame);

        async function initAudio() {
            try {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                if (ac.state === 'suspended') await ac.resume();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                analyser = ac.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.6;
                ac.createMediaStreamSource(stream).connect(analyser);
                freqs = new Uint8Array(analyser.frequencyBinCount);
            } catch (e) { console.error('Mic error', e); setState('', t('mic')); }
        }

        // ── 起動 ─────────────────────────────────────────────
        async function waitForBackend() {
            const st = $('start'); st.style.pointerEvents = 'none';
            $('startLabel').textContent = 'CONNECTING';
            while (true) {
                try { if ((await fetch('http://127.0.0.1:8000/v1/models')).ok) break; } catch (_) { }
                await new Promise(r => setTimeout(r, 1000));
            }
            $('startLabel').textContent = 'TAP TO START'; st.style.pointerEvents = 'auto';
        }
        $('start').onclick = async () => {
            const st = $('start'); st.style.opacity = '0'; setTimeout(() => st.style.display = 'none', 500);
            isActive = true; loadVoices(); await initAudio();
        };

        // 直近の会話を開く(なければ新規)
        cur = chats.length ? [...chats].sort((a, b) => b.updated - a.updated)[0] : null;
        if (!cur) cur = { id: Date.now().toString(36), title: '', updated: Date.now(), messages: [] };
        applyPrefs(); renderLog(); renderList();
        waitForBackend();
    </script>
</body>

</html>
