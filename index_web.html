<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>AI Assistant</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* ビジュアル調整パネルから書き換える変数(テキスト/背景の沈み用) */
        :root {
            --ai-text-size: 22px;
            --ai-text-color: #ffffff;
            --user-text-size: 26px;
            --user-text-color: #ebebeb;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 音声入力ビジュアライザー: ユーザーが話している瞬間だけ表示する。
           不透明度は JS(visualize)が毎フレーム制御し、通常時は opacity:0 で完全に非表示。 */
        #visualizerContainer {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(560px, 86vw);
            height: 150px;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
        }

        #visualizerCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(5px);
            transition: opacity .5s ease;
            cursor: pointer;
        }

        .start-text {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .8);
            text-shadow: 0 0 10px rgba(255, 255, 255, .3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .6;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        #langToggle {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 20;
            display: flex;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(6px);
        }

        .lang-btn {
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, .45);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color .2s, background .2s;
            user-select: none;
        }

        .lang-btn.active {
            background: rgba(255, 255, 255, .18);
            color: #fff;
        }

        /* ── 設定ボタン・パネル ─────────────────────────────────────────────── */
        #settingsToggle {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 25;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 50%;
            backdrop-filter: blur(6px);
            color: rgba(255, 255, 255, .8);
            font-size: 18px;
            cursor: pointer;
            transition: background .2s, transform .3s;
        }

        #settingsToggle:hover {
            background: rgba(255, 255, 255, .16);
        }

        #settingsToggle.open {
            transform: rotate(60deg);
        }

        #settingsPanel {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            max-width: 88vw;
            z-index: 24;
            background: rgba(12, 12, 14, .88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-right: 1px solid rgba(255, 255, 255, .1);
            box-shadow: 20px 0 40px rgba(0, 0, 0, .5);
            transform: translateX(-100%);
            transition: transform .35s ease;
            overflow-y: auto;
            padding: 74px 18px 24px;
            -ms-overflow-style: none;
            scrollbar-width: thin;
        }

        #settingsPanel.open {
            transform: translateX(0);
        }

        .settings-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .settings-title {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .55);
        }

        .reset-all-btn {
            font-size: 11px;
            letter-spacing: .5px;
            color: rgba(255, 255, 255, .55);
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 12px;
            padding: 5px 12px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .reset-all-btn:hover {
            background: rgba(255, 255, 255, .18);
            color: #fff;
        }

        .settings-group-title {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .35);
            margin: 22px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
        }

        .settings-group-title:first-of-type {
            margin-top: 10px;
        }

        .setting-row {
            margin-bottom: 14px;
        }

        .setting-row label {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, .7);
            margin-bottom: 6px;
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-control input[type="range"] {
            flex: 1;
            accent-color: #6be3ff;
            cursor: pointer;
        }

        .setting-control input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 34px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 6px;
            background: none;
            cursor: pointer;
        }

        .setting-control input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .setting-control input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 5px;
        }

        .setting-control select {
            flex: 1;
            background: rgba(255, 255, 255, .08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 6px;
            padding: 5px 6px;
            font-size: 12px;
        }

        .setting-value {
            font-size: 11px;
            color: rgba(255, 255, 255, .45);
            min-width: 38px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .setting-reset {
            flex: none;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            color: rgba(255, 255, 255, .55);
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            transition: background .2s, color .2s, transform .3s;
        }

        .setting-reset:hover {
            background: rgba(255, 255, 255, .16);
            color: #fff;
            transform: rotate(-70deg);
        }

        .status-indicator {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 5;
            white-space: nowrap;
        }

        .chat-container {
            position: absolute;
            bottom: 90px;
            width: 82%;
            max-width: 820px;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: thin;
        }

        .input-container {
            position: absolute;
            bottom: 30px;
            width: 82%;
            max-width: 820px;
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        #textInput {
            flex: 1;
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 16px;
            backdrop-filter: blur(5px);
            outline: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #textInput::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #ttsBtn,
        #micBtn,
        #webBtn,
        #sendBtn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            border-radius: 24px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(5px);
            transition: background 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ttsBtn:hover,
        #micBtn:hover,
        #webBtn:hover,
        #sendBtn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        #ttsBtn.muted {
            opacity: 0.5;
        }

        #webBtn {
            font-size: 13px;
            letter-spacing: .5px;
            white-space: nowrap;
        }

        #webBtn[data-mode="on"] {
            border-color: rgba(107, 227, 255, .7);
            background: rgba(107, 227, 255, .16);
        }

        #webBtn[data-mode="off"] {
            opacity: 0.5;
        }

        #micBtn.recording {
            background: rgba(255, 50, 50, 0.5);
            border-color: rgba(255, 50, 50, 0.8);
            animation: pulse 1.5s infinite;
        }

        /* 読み上げ・生成中は認識を止めているので、マイクボタンを一時的に控えめにする */
        #micBtn.paused {
            animation: none;
            opacity: .45;
        }

        .ai-text {
            font-size: var(--ai-text-size);
            font-weight: 400;
            color: var(--ai-text-color);
            min-height: 30px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }

        .user-text {
            font-size: var(--user-text-size);
            font-weight: 500;
            color: var(--user-text-color);
            min-height: 36px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
            transition: opacity .3s ease;
        }

        /* Web検索の情報源。空のときは表示されない */
        .sources-text {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, .45);
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }

        .sources-text:empty {
            display: none;
        }

        /* 情報源カード(アイコン + サイトタイトル + ドメイン・公開日時) */
        .sources-text .src {
            display: flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
            max-width: 100%;
            margin: 4px auto;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 12px;
            background: rgba(255, 255, 255, .06);
            text-align: left;
            text-decoration: none;
            transition: background .2s, border-color .2s;
        }

        .sources-text .src:hover {
            background: rgba(255, 255, 255, .14);
            border-color: rgba(107, 227, 255, .5);
        }

        .sources-text .src img {
            flex: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .1);
        }

        .sources-text .src-body {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .sources-text .src-title {
            font-size: 13px;
            color: rgba(255, 255, 255, .88);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sources-text .src-host {
            font-size: 11px;
            color: rgba(255, 255, 255, .4);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <button id="settingsToggle" title="表示設定">⚙</button>
    <div id="settingsPanel"></div>

    <div id="langToggle">
        <button class="lang-btn active" data-lang="ja">日本語</button>
        <button class="lang-btn" data-lang="en">English</button>
    </div>

    <div id="startOverlay" class="overlay">
        <div class="start-text" id="startLabel">タップして開始</div>
    </div>

    <div class="status-indicator" id="statusText">Ready</div>

    <div id="visualizerContainer">
        <canvas id="visualizerCanvas"></canvas>
    </div>

    <div class="chat-container">
        <div class="ai-text" id="aiText"></div>
        <div class="sources-text" id="sourcesText"></div>
        <div class="user-text" id="userText"></div>
    </div>

    <div class="input-container">
        <button id="ttsBtn" title="Toggle Speech">🔊</button>
        <button id="micBtn" title="Voice Input">🎤</button>
        <button id="webBtn" title="Web Search">🌐 Auto</button>
        <input type="text" id="textInput" placeholder="メッセージを入力..." />
        <button id="sendBtn">送信</button>
    </div>

    <script>
        // ── Elements ──────────────────────────────────────────────────────────────
        const startOverlay = document.getElementById('startOverlay');
        const startLabel = document.getElementById('startLabel');
        const visContainer = document.getElementById('visualizerContainer');
        const visCanvas = document.getElementById('visualizerCanvas');
        const visCtx = visCanvas.getContext('2d');
        const userText = document.getElementById('userText');
        const aiText = document.getElementById('aiText');
        const statusText = document.getElementById('statusText');
        const langToggle = document.getElementById('langToggle');
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPanel = document.getElementById('settingsPanel');
        const textInput = document.getElementById('textInput');
        const ttsBtn = document.getElementById('ttsBtn');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const webBtn = document.getElementById('webBtn');
        const sourcesText = document.getElementById('sourcesText');

        // ── i18n ──────────────────────────────────────────────────────────────────
        let currentLang = 'ja';
        const i18n = {
            ja: {
                start: 'Tap to Start',
                listening: 'Listening...',
                thinking: 'Thinking...',
                speaking: 'Speaking...',
                error: 'Error occurred. Please try again.',
                micError: 'Microphone access not granted.',
                noSpeech: 'Your browser does not support speech recognition. Please use Chrome.',
                sysPrompt: 'You are a kind and concise AI assistant. Please answer naturally in Japanese.',
                recogLang: 'ja-JP',
                ttsLang: 'ja-JP',
                placeholder: 'メッセージを入力...',
                send: '送信',
                searching: 'Searching the web...',
                searchOffline: 'Search server offline - answering without web search',
                webTitle: { auto: 'Web検索: 必要なときだけ自動で検索', on: 'Web検索: 毎回検索', off: 'Web検索: 使わない' },
            },
            en: {
                start: 'Tap to Start',
                listening: 'Listening...',
                thinking: 'Thinking...',
                speaking: 'Speaking...',
                error: 'An error occurred. Please try again.',
                micError: 'Microphone access was denied.',
                noSpeech: 'Your browser does not support speech recognition. Please use Chrome.',
                sysPrompt: 'You are a helpful, concise AI assistant. Please respond in English naturally as if in a conversation.',
                recogLang: 'en-US',
                ttsLang: 'en-US',
                placeholder: 'Enter a message...',
                send: 'Send',
                searching: 'Searching the web...',
                searchOffline: 'Search server offline - answering without web search',
                webTitle: { auto: 'Web search: automatic when needed', on: 'Web search: every message', off: 'Web search: off' },
            },
        };
        const t = key => i18n[currentLang][key];

        // ── State ─────────────────────────────────────────────────────────────────
        let isActive = false;
        let isGenerating = false;
        let isSpeaking = false;
        let activeUtterances = 0;
        // 読み上げの世代番号。cancel() 後に遅れて届く古い onend/onerror を無視するために使う。
        let speakGen = 0;
        // 生成(ストリーミング)が完全に終わったかどうか。
        // これがtrueになるまでは、TTSキューが一時的に空になっても認識を再開しない。
        let streamFinished = true;
        // 生成中のfetchを中断するためのAbortController(新しい送信で前のものを中断する用)
        let currentAbortController = null;
        let isMicRequested = false;   // ユーザーがマイクをONにしているか(意図)
        let isTtsEnabled = true;
        const serverUrl = 'http://127.0.0.1:8000/v1/chat/completions';
        // web_search.py (検索 + LLM回答)。uvicorn web_search:app --port 8002 で起動しておく。
        const searchAskUrl = 'http://127.0.0.1:8002/ask';
        // Web検索モード: auto=必要そうな質問のみ / on=毎回 / off=使わない
        let webMode = 'auto';

        // AIが生成中・読み上げ中か。この間は音声認識を止める(AIの声をマイクが拾わないようにする)。
        const isBusy = () => isGenerating || isSpeaking;

        function clearAI() {
            aiText.textContent = '';
            sourcesText.textContent = '';
        }

        // 公開日時の表示用。日付のみ(UTC 0:00)の場合は時刻を出さない
        function fmtDate(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return '';
            const p = n => String(n).padStart(2, '0');
            if (!d.getUTCHours() && !d.getUTCMinutes() && !d.getUTCSeconds())
                return `${d.getUTCFullYear()}/${p(d.getUTCMonth() + 1)}/${p(d.getUTCDate())}`;
            d.setHours(d.getHours());
            return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }


        // 情報源をカード(サイトアイコン + サイトタイトル + ドメイン・公開日時)として描画する。
        // クリックで新しいタブで開く(http/httpsのみ許可)。
        // sources の要素は文字列(URL)、または {url, title, published} のオブジェクトのどちらでもよい。
        // タイトルが無い場合はドメイン名を表示する。
        function renderSources(sources) {
            sourcesText.textContent = '';
            (sources || []).forEach(item => {
                const rawUrl = typeof item === 'string' ? item : (item && item.url);
                const rawTitle = typeof item === 'string' ? '' : ((item && (item.title || item.name)) || '');
                let u;
                try { u = new URL(rawUrl); } catch (_) { return; }
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
                const host = u.hostname.replace(/^www\./, '');

                const a = document.createElement('a');
                a.className = 'src';
                a.href = u.href;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.title = u.href;

                // サイトアイコン: まずGoogleのfaviconサービス、失敗したらサイト直下のfavicon.ico、それも失敗なら非表示
                const img = document.createElement('img');
                img.alt = '';
                img.referrerPolicy = 'no-referrer';
                let step = 0;
                img.onerror = () => {
                    if (step === 0) { step = 1; img.src = u.origin + '/favicon.ico'; }
                    else img.style.visibility = 'hidden';
                };
                img.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(u.hostname) + '&sz=64';

                const body = document.createElement('div');
                body.className = 'src-body';
                const title = document.createElement('span');
                title.className = 'src-title';
                title.textContent = rawTitle || host;
                const hostEl = document.createElement('span');
                hostEl.className = 'src-host';
                const ds = (item && typeof item === 'object' && item.published) ? fmtDate(item.published) : '';
                const meta = [rawTitle ? host : '', ds].filter(Boolean).join(' · ');
                hostEl.textContent = meta;
                body.appendChild(title);
                if (meta) body.appendChild(hostEl);

                a.appendChild(img);
                a.appendChild(body);
                sourcesText.appendChild(a);
            });
        }

        function handleSendText() {
            const text = textInput.value.trim();
            if (text) {
                userText.textContent = text;
                clearAI();
                textInput.value = '';
                sendToAI(text);
            }
        }
        sendBtn.addEventListener('click', handleSendText);
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.isComposing) handleSendText();
        });

        ttsBtn.addEventListener('click', () => {
            isTtsEnabled = !isTtsEnabled;
            ttsBtn.textContent = isTtsEnabled ? '🔊' : '🔇';
            ttsBtn.classList.toggle('muted', !isTtsEnabled);
            if (!isTtsEnabled && isSpeaking) {
                speakGen++;                       // 読み上げ中の発話の後始末イベントを無効化
                window.speechSynthesis.cancel();
                activeUtterances = 0;
                isSpeaking = false;
                if (streamFinished) finishGenerationAndListen();
            }
        });

        // Web検索モードの切り替え (auto → on → off → auto)
        function renderWebBtn() {
            const label = { auto: 'Auto', on: 'ON', off: 'OFF' }[webMode];
            webBtn.textContent = '🌐 ' + label;
            webBtn.dataset.mode = webMode;
            webBtn.title = t('webTitle')[webMode];
        }
        webBtn.addEventListener('click', () => {
            const order = ['auto', 'on', 'off'];
            webMode = order[(order.indexOf(webMode) + 1) % order.length];
            renderWebBtn();
        });
        renderWebBtn();

        micBtn.addEventListener('click', () => {
            if (!isMicRequested) {
                isMicRequested = true;
                micBtn.classList.add('recording');
                startRecognition();               // 生成・読み上げ中なら、終了後に syncRecognition() が開始する
                if (isMicRequested && !isBusy()) statusText.textContent = t('listening');
            } else {
                isMicRequested = false;
                micBtn.classList.remove('recording');
                stopRecognition();
                if (!isBusy()) statusText.textContent = 'Ready';
            }
            updateMicVisual();
        });

        // 認識を一時停止している間(生成・読み上げ中)は、マイクボタンを控えめに表示する
        function updateMicVisual() {
            micBtn.classList.toggle('paused', isMicRequested && isBusy());
        }

        // ── 音声認識の一時停止 / 再開 ───────────────────────────────────────────
        // AIが生成・読み上げをしている間は認識を止め、終わってから少し待って再開する。
        // (スピーカーの音をマイクが拾って、AIの声を質問として誤認識するのを防ぐ)
        let resumeTimer = null;
        function syncRecognition() {
            clearTimeout(resumeTimer);
            updateMicVisual();
            if (isBusy()) { stopRecognition(); return; }
            if (isMicRequested && isActive) {
                // 読み上げの余韻(スピーカーの残響)が収まるのを少し待つ
                resumeTimer = setTimeout(() => {
                    if (!isBusy() && isMicRequested) startRecognition();
                }, 600);
            }
        }

        // 生成・読み上げが完全に終わったときに呼ぶ後始末処理
        function finishGenerationAndListen() {
            isGenerating = false;
            isSpeaking = false;
            userText.textContent = '';
            userText.style.opacity = '1';
            statusText.textContent = isMicRequested ? t('listening') : 'Ready';
            syncRecognition();                    // 認識を再開
        }

        // ── Language toggle ───────────────────────────────────────────────────────
        function applyLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.lang === lang));
            startLabel.textContent = t('start');
            renderWebBtn();
            if (textInput) textInput.placeholder = t('placeholder');
            if (sendBtn) sendBtn.textContent = t('send');

            if (!isActive) return;

            // 認識言語は作成時に決まるため、作り直して新しい言語を反映する
            // (生成・読み上げ中は再開しない。終了時に syncRecognition() が新しい言語で開始する)
            if (isMicRequested) {
                stopRecognition();
                if (!isBusy()) startRecognition();
            }
        }
        langToggle.addEventListener('click', e => {
            const btn = e.target.closest('.lang-btn');
            if (btn && btn.dataset.lang !== currentLang) applyLang(btn.dataset.lang);
        });

        // ── TTS ──────────────────────────────────────────────────────────────────
        let voices = [];
        function loadVoices() { voices = window.speechSynthesis.getVoices(); }
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined)
            window.speechSynthesis.onvoiceschanged = loadVoices;

        function pickVoice(lang) {
            return voices.find(v => v.lang === lang)
                || voices.find(v => v.lang.startsWith(lang.split('-')[0]))
                || null;
        }

        // TTS が全部終わったら finishGenerationAndListen() を呼ぶ
        function speakSentence(text, lang) {
            if (!text.trim() || !isTtsEnabled) return;
            const utt = new SpeechSynthesisUtterance(text);
            utt.lang = lang;
            utt.rate = 1.0; utt.pitch = 1.0; utt.volume = 1.0;
            const v = pickVoice(lang);
            if (v) utt.voice = v;

            activeUtterances++;
            isSpeaking = true;
            const gen = speakGen;

            const onDone = () => {
                if (gen !== speakGen) return;     // cancel() 後に遅れて届いた古いイベントは無視
                activeUtterances = Math.max(0, activeUtterances - 1);
                // キューが一時的に空でも、ストリーミングがまだ続いていれば
                // (streamFinished === false) 後始末はしない。
                if (activeUtterances === 0 && streamFinished) {
                    finishGenerationAndListen();
                }
            };
            utt.onend = onDone;
            utt.onerror = onDone;

            window.speechSynthesis.speak(utt);
        }

        // ── Web Speech Recognition (STT) ────────────────────────────────────────
        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let recognitionRunning = false;
        let recRestartTimer = null;

        function createRecognition() {
            const rec = new SpeechRecognitionCtor();
            rec.continuous = true;       // 話し終えても止まらず聞き続ける
            rec.interimResults = true;   // 認識途中の結果も受け取る
            rec.maxAlternatives = 1;
            rec.lang = t('recogLang');

            rec.onstart = () => { recognitionRunning = true; };

            rec.onresult = (e) => {
                // 生成・読み上げ中は認識結果を一切使わない(停止直前に届いた結果も捨てる)
                if (isBusy()) return;

                let interim = '';
                let finalText = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const r = e.results[i];
                    if (r.isFinal) finalText += r[0].transcript;
                    else interim += r[0].transcript;
                }

                // 認識途中の文字をリアルタイム表示
                if (interim) {
                    userText.textContent = interim;
                    userText.style.opacity = '1';
                }

                finalText = finalText.trim();
                if (!finalText) return;

                userText.textContent = finalText;
                clearAI();
                sendToAI(finalText);
            };

            rec.onerror = (e) => {
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    isMicRequested = false;
                    micBtn.classList.remove('recording');
                    updateMicVisual();
                    statusText.textContent = t('micError');
                } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
                    console.warn('[SpeechRecognition] error:', e.error);
                }
            };

            // Chromeは無音や時間経過で勝手に終了するため、マイクONの間は自動で再開する
            // (生成・読み上げ中は再開しない。終了時に syncRecognition() が再開する)
            rec.onend = () => {
                recognitionRunning = false;
                if (isMicRequested && isActive && !isBusy()) {
                    clearTimeout(recRestartTimer);
                    recRestartTimer = setTimeout(startRecognition, 300);
                }
            };

            return rec;
        }

        function startRecognition() {
            if (!SpeechRecognitionCtor) {
                statusText.textContent = t('noSpeech');
                isMicRequested = false;
                micBtn.classList.remove('recording');
                return;
            }
            if (recognitionRunning || isBusy()) return;   // 生成・読み上げ中は開始しない
            recognition = createRecognition();            // 作成時に現在の言語が反映される
            try { recognition.start(); } catch (e) { console.warn('[SpeechRecognition] start failed:', e); }
        }

        function stopRecognition() {
            clearTimeout(recRestartTimer);
            clearTimeout(resumeTimer);
            if (recognition) {
                recognition.onend = null;          // 自動再開させない
                recognition.onresult = null;       // 停止後に遅れて届く結果も受け取らない
                try { recognition.abort(); } catch (_) { }
                recognition = null;
            }
            recognitionRunning = false;
        }

        // ── AI call ───────────────────────────────────────────────────────────────
        // Web検索が有効なら web_search.py(/ask) 経由で「検索 → LLM回答」を行う。
        // 検索サーバーに接続できない場合は、従来どおり llama-server へ直接問い合わせる。
        async function openChatStream(body, signal) {
            const headers = { 'Content-Type': 'application/json' };
            if (webMode !== 'off') {
                try {
                    const res = await fetch(searchAskUrl, {
                        method: 'POST', headers, signal,
                        body: JSON.stringify({ ...body, mode: webMode === 'on' ? 'always' : 'auto', lang: currentLang }),
                    });
                    if (res.ok) return res;
                    console.warn('[WebSearch] /ask returned', res.status);
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                    console.warn('[WebSearch] search server unreachable, falling back to direct LLM:', e);
                    statusText.textContent = t('searchOffline');
                }
            }
            return fetch(serverUrl, {
                method: 'POST', headers, signal,
                body: JSON.stringify({ ...body, stream: true }),
            });
        }

        async function sendToAI(promptText) {
            if (currentAbortController) {
                try { currentAbortController.abort(); } catch (_) { }
            }
            isGenerating = true;
            streamFinished = false;
            sourcesText.textContent = '';

            // 生成を始めた時点から、読み上げが終わるまでマイク認識を止める
            syncRecognition();
            statusText.textContent = t('thinking');

            speakGen++;                              // 前回の読み上げの後始末イベントを無効化
            window.speechSynthesis.cancel();
            activeUtterances = 0;
            isSpeaking = false;

            const ttsLang = t('ttsLang');

            // このリクエストを後から中断できるようにする(新しい送信が来たとき用)
            const controller = new AbortController();
            currentAbortController = controller;

            try {
                const response = await openChatStream({
                    messages: [
                        { role: 'system', content: t('sysPrompt') },
                        { role: 'user', content: promptText },
                    ],
                    temperature: 0.7,
                    max_tokens: 500,
                }, controller.signal);
                if (!response.ok) throw new Error('API Error');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullReply = '';
                let speakBuf = '';
                let sseBuf = '';
                let sources = [];      // Web検索で使った情報源(URL・タイトル・公開日時。回答の最後に届く)
                let started = false;

                // 「.」は直後が空白のときだけ文末扱い(URLの x.example や小数 24.5 を分断しない)
                const sentenceEnds = /[!?。！？\n]|\.(?=\s)/;

                // SSEの1行を処理する。回答トークン / 検索の進捗 / 情報源 / エラー を振り分ける。
                const handleLine = (line) => {
                    if (!line.startsWith('data: ') || line === 'data: [DONE]') return;
                    let obj;
                    try { obj = JSON.parse(line.slice(6)); } catch (_) { return; }
                    if (obj.error) throw new Error(obj.error);
                    if (obj.web_search) {
                        const st = obj.web_search.status;
                        if (st === 'searching') statusText.textContent = t('searching');
                        else if (st === 'done' || st === 'empty' || st === 'skipped') statusText.textContent = t('thinking');
                        else if (st === 'sources') sources = obj.web_search.sources || [];
                        return;
                    }
                    const token = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
                    if (!token) return;
                    if (!started) {
                        started = true;
                        statusText.textContent = t('speaking');
                        userText.style.opacity = '0.5';
                    }
                    fullReply += token;
                    speakBuf += token;
                    aiText.textContent = fullReply;
                    let m;
                    while ((m = speakBuf.match(sentenceEnds)) !== null) {
                        const idx = m.index + m[0].length;
                        const s = speakBuf.substring(0, idx);
                        speakBuf = speakBuf.substring(idx);
                        // URLは読み上げない
                        const spoken = s.replace(/https?:\/\/\S+/g, '');
                        if (spoken.trim()) speakSentence(spoken, ttsLang);
                    }
                };

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    // チャンク境界で行が途切れても壊れないよう、未完了の行はバッファに残す
                    sseBuf += decoder.decode(value, { stream: true });
                    const lines = sseBuf.split('\n');
                    sseBuf = lines.pop();
                    for (const line of lines) handleLine(line);
                }
                if (sseBuf) handleLine(sseBuf);

                // 文末記号で終わらなかった最後の断片も読み上げる(URLは除く)
                if (speakBuf.trim()) {
                    const rest = speakBuf.replace(/https?:\/\/\S+/g, '');
                    speakBuf = '';
                    if (rest.trim()) speakSentence(rest, ttsLang);
                }

                // 情報源は読み上げ対象にせず、カードとして表示する(公開日時つき)
                renderSources(sources);

                // ストリーミング自体はここで完了。
                // まだ再生中の発話が残っていれば、それらが終わるのを
                // speakSentenceのonDoneが検知してfinishGenerationAndListen()を呼ぶ。
                streamFinished = true;
                currentAbortController = null;

                // 発話すべき内容が何もなかった場合は即リスニングに戻る
                if (activeUtterances === 0) {
                    finishGenerationAndListen();
                }

            } catch (e) {
                if (e.name === 'AbortError') {
                    // 新しい送信によって中断された。状態は新しいリクエスト側が管理するので何もしない。
                    return;
                }
                console.error(e);
                speakGen++;
                window.speechSynthesis.cancel();
                activeUtterances = 0;
                isSpeaking = false;
                streamFinished = true;
                currentAbortController = null;
                aiText.textContent = t('error');
                finishGenerationAndListen();
            }
        }

        // ── Voice Input Visualizer ────────────────────────────────────────────────
        // ユーザーが音声入力で「話している瞬間」だけ表示する。
        // 待機中 / AIの思考中・発話中 / テキスト入力時は一切描画しない。
        let audioCtx, analyser, VW, VH, dpr = 1;
        let micFreqs = null;

        // 設定パネルから変更できるパラメーター
        const vis = { color: '#6be3ff', amp: 1, threshold: 0.12, smoothing: 0.6, hold: 450 };
        const VIS_HALF_BARS = 24;     // 中心から左右へ広がるバーの本数(片側)
        const VOICE_BIN_MAX = 28;     // fftSize=256 で約 0.2〜5kHz(声の帯域)
        const barHeights = new Float32Array(VIS_HALF_BARS);
        let visAlpha = 0, visHoldUntil = 0, visShown = false;

        // "#rrggbb" → "r,g,b"
        function hexToRgbStr(hex) {
            const h = (hex || '#ffffff').replace('#', '');
            const r = parseInt(h.substring(0, 2), 16) || 0;
            const g = parseInt(h.substring(2, 4), 16) || 0;
            const b = parseInt(h.substring(4, 6), 16) || 0;
            return `${r},${g},${b}`;
        }

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            const rect = visCanvas.getBoundingClientRect();
            VW = visCanvas.width = Math.max(1, Math.round(rect.width * dpr));
            VH = visCanvas.height = Math.max(1, Math.round(rect.height * dpr));
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawBars() {
            visCtx.clearRect(0, 0, VW, VH);
            const n = VIS_HALF_BARS * 2;
            const gap = VW / n;
            const barW = Math.max(2, gap * 0.55);
            const mid = VH / 2;
            const rgb = hexToRgbStr(vis.color);
            visCtx.fillStyle = `rgb(${rgb})`;
            visCtx.shadowColor = `rgba(${rgb},.8)`;
            visCtx.shadowBlur = 10 * dpr;
            for (let k = 0; k < n; k++) {
                // 中心ほど低音域。左右対称に広がる。
                const i = k < VIS_HALF_BARS ? VIS_HALF_BARS - 1 - k : k - VIS_HALF_BARS;
                const h = Math.max(barW, Math.min(VH * 0.95, barHeights[i] * VH * vis.amp));
                const x = k * gap + (gap - barW) / 2;
                visCtx.beginPath();
                if (visCtx.roundRect) visCtx.roundRect(x, mid - h / 2, barW, h, barW / 2);
                else visCtx.rect(x, mid - h / 2, barW, h);
                visCtx.fill();
            }
        }

        function visualize() {
            requestAnimationFrame(visualize);
            const now = performance.now();

            // マイク入力を待ち受けていて、AIが応答中でないときだけ音量を見る
            const listening = isMicRequested && !isGenerating && !isSpeaking && analyser && micFreqs;
            let active = false;
            if (listening) {
                analyser.getByteFrequencyData(micFreqs);
                let sum = 0;
                for (let i = 1; i < VOICE_BIN_MAX; i++) sum += micFreqs[i];
                const level = sum / (VOICE_BIN_MAX - 1) / 255;
                if (level > vis.threshold) visHoldUntil = now + vis.hold;   // 話している間は表示を保持
                active = now < visHoldUntil;
                for (let i = 0; i < VIS_HALF_BARS; i++) {
                    if (active) {
                        const idx = 1 + Math.floor(i * (VOICE_BIN_MAX - 1) / VIS_HALF_BARS);
                        const v = micFreqs[idx] / 255;
                        barHeights[i] += (v - barHeights[i]) * 0.45;
                    } else {
                        barHeights[i] *= 0.85;
                    }
                }
            } else {
                visHoldUntil = 0;
                for (let i = 0; i < VIS_HALF_BARS; i++) barHeights[i] *= 0.85;
            }

            visAlpha += ((active ? 1 : 0) - visAlpha) * (active ? 0.4 : 0.2);
            if (visAlpha < 0.02) {
                visAlpha = 0;
                if (visShown) {                     // 完全に消す(以降は何も描画しない)
                    visCtx.clearRect(0, 0, VW, VH);
                    visContainer.style.opacity = '0';
                    barHeights.fill(0);
                    visShown = false;
                }
                return;
            }
            visShown = true;
            visContainer.style.opacity = visAlpha.toFixed(3);
            drawBars();
        }
        requestAnimationFrame(visualize);

        async function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            try {
                // ビジュアライザー用のマイク入力。
                // (音声認識自体は Web Speech Recognition が別途マイクを使用する)
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                    },
                });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.minDecibels = -70;
                analyser.maxDecibels = 0;
                analyser.smoothingTimeConstant = vis.smoothing;
                audioCtx.createMediaStreamSource(stream).connect(analyser);
                micFreqs = new Uint8Array(analyser.frequencyBinCount);
            } catch (e) {
                console.error('Mic error', e);
                alert(t('micError'));
            }
        }

        // ── 表示設定パネル ────────────────────────────────────────────────────────
        // すべての値の「初期値(リセット先)」。vis / CSS変数のどちらに
        // 反映するかは applySetting() 側で振り分ける。
        const settingDefaults = {
            visColor: '#6be3ff', visAmp: 1, visThreshold: 0.12, visSmoothing: 0.6,
            aiTextSize: 22, aiTextColor: '#ffffff', userTextSize: 26, userTextColor: '#ebebeb',
        };
        // 現在値(パネルのinputはこれを表示・更新する)
        const settingValues = { ...settingDefaults };

        // パネルに並べる項目定義。groupが指定されている行の直前に見出しが入る。
        const fieldDefs = [
            { group: '音声入力ビジュアライザー', key: 'visColor', label: '色', type: 'color' },
            { key: 'visAmp', label: '高さ', type: 'range', min: 0.3, max: 2, step: 0.05 },
            { key: 'visThreshold', label: '表示を始める音量(大きいほど鈍感)', type: 'range', min: 0.02, max: 0.5, step: 0.01 },
            { key: 'visSmoothing', label: '滑らかさ', type: 'range', min: 0, max: 0.95, step: 0.01 },

            { group: 'テキスト', key: 'aiTextSize', label: 'AIテキストサイズ', type: 'range', min: 12, max: 40, step: 1, unit: 'px' },
            { key: 'aiTextColor', label: 'AIテキストカラー', type: 'color' },
            { key: 'userTextSize', label: 'ユーザーテキストサイズ', type: 'range', min: 12, max: 44, step: 1, unit: 'px' },
            { key: 'userTextColor', label: 'ユーザーテキストカラー', type: 'color' },
        ];

        // 実際に vis / CSS変数へ反映する
        function applySetting(key, value) {
            settingValues[key] = value;
            switch (key) {
                case 'visColor': vis.color = value; break;
                case 'visAmp': vis.amp = parseFloat(value); break;
                case 'visThreshold': vis.threshold = parseFloat(value); break;
                case 'visSmoothing':
                    vis.smoothing = parseFloat(value);
                    if (analyser) analyser.smoothingTimeConstant = vis.smoothing;
                    break;
                case 'aiTextSize':
                    document.documentElement.style.setProperty('--ai-text-size', value + 'px'); break;
                case 'aiTextColor':
                    document.documentElement.style.setProperty('--ai-text-color', value); break;
                case 'userTextSize':
                    document.documentElement.style.setProperty('--user-text-size', value + 'px'); break;
                case 'userTextColor':
                    document.documentElement.style.setProperty('--user-text-color', value); break;
            }
        }

        // 指定した1項目だけをinput要素・値表示ごとデフォルトへ戻す
        function resetField(def) {
            const value = settingDefaults[def.key];
            const input = document.getElementById('set-' + def.key);
            if (input) input.value = value;
            const valSpan = document.getElementById('set-' + def.key + '-val');
            if (valSpan) valSpan.textContent = (def.unit || '') ? value + def.unit : value;
            applySetting(def.key, value);
        }

        function buildSettingsPanel() {
            let html = `
        <div class="settings-header-row">
          <span class="settings-title">表示設定</span>
          <button type="button" class="reset-all-btn" id="resetAllBtn">すべてリセット</button>
        </div>`;

            fieldDefs.forEach(def => {
                if (def.group) html += `<div class="settings-group-title">${def.group}</div>`;

                const value = settingValues[def.key];
                let controlHtml = '';

                if (def.type === 'color') {
                    controlHtml = `<input type="color" id="set-${def.key}" value="${value}">`;
                } else if (def.type === 'select') {
                    const optionsHtml = def.options.map(o =>
                        `<option value="${o.v}" ${o.v === value ? 'selected' : ''}>${o.l}</option>`).join('');
                    controlHtml = `<select id="set-${def.key}">${optionsHtml}</select>`;
                } else {
                    const shown = (def.unit || '') ? value + def.unit : value;
                    controlHtml = `
            <input type="range" id="set-${def.key}" min="${def.min}" max="${def.max}" step="${def.step}" value="${value}">
            <span class="setting-value" id="set-${def.key}-val">${shown}</span>`;
                }

                html += `
          <div class="setting-row">
            <label for="set-${def.key}">${def.label}</label>
            <div class="setting-control">
              ${controlHtml}
              <button type="button" class="setting-reset" data-key="${def.key}" title="この項目をリセット">↺</button>
            </div>
          </div>`;
            });

            settingsPanel.innerHTML = html;

            // 各コントロールの変更を反映
            fieldDefs.forEach(def => {
                const input = document.getElementById('set-' + def.key);
                if (!input) return;
                const handler = () => {
                    const v = input.value;
                    applySetting(def.key, def.type === 'range' ? parseFloat(v) : v);
                    const valSpan = document.getElementById('set-' + def.key + '-val');
                    if (valSpan) valSpan.textContent = (def.unit || '') ? v + def.unit : v;
                };
                input.addEventListener('input', handler);
                input.addEventListener('change', handler);
            });

            // 個別リセットボタン
            settingsPanel.querySelectorAll('.setting-reset').forEach(btn => {
                btn.addEventListener('click', () => {
                    const def = fieldDefs.find(f => f.key === btn.dataset.key);
                    if (def) resetField(def);
                });
            });

            // 全項目リセット
            document.getElementById('resetAllBtn').addEventListener('click', () => {
                fieldDefs.forEach(resetField);
            });
        }

        buildSettingsPanel();
        // 現在値(=初期値)をCSS変数/visへ反映しておく
        fieldDefs.forEach(def => applySetting(def.key, settingValues[def.key]));

        settingsToggle.addEventListener('click', () => {
            const isOpen = settingsPanel.classList.toggle('open');
            settingsToggle.classList.toggle('open', isOpen);
        });

        // ── Check Backend ──────────────────────────────────────────────────────────
        async function waitForBackend() {
            startLabel.textContent = "Waiting for Backend...";
            startOverlay.style.pointerEvents = "none";

            // llama-server (port 8000) を待つ
            while (true) {
                try {
                    const res = await fetch("http://127.0.0.1:8000/v1/models");
                    if (res.ok) break;
                } catch (e) { /* retry */ }
                await new Promise(r => setTimeout(r, 1000));
            }

            startLabel.textContent = "AI Assistant Ready - " + t('start');
            startOverlay.style.pointerEvents = "auto";
        }

        waitForBackend();

        // ── Start ─────────────────────────────────────────────────────────────────
        startOverlay.addEventListener('click', async () => {
            startOverlay.style.opacity = '0';
            setTimeout(() => startOverlay.style.display = 'none', 500);
            isActive = true;
            streamFinished = true;
            loadVoices();
            await initAudio();
            // 音声認識はマイクボタンを押すまで開始しない
        });
    </script>
</body>

</html>
